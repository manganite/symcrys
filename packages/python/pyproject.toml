[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "symcrys"
# Equal to packages/ts/package.json (one version for both packages; checked by the tests of both).
version = "0.11.0"
description = "Crystallographic symmetry calculations: point groups (crystallographic and magnetic) and plane groups, their settings, symbols, site symmetry, Wyckoff positions, crystal forms and orbits, and the forms of property tensors. The TypeScript library symcrys of the same version, in an embedded JavaScript engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Lottermoser" }]
requires-python = ">=3.10"
dependencies = ["quickjs-ng>=0.18", "numpy>=1.23"]
keywords = ["crystallography", "symmetry", "point-groups", "magnetic-point-groups", "plane-groups", "tensors", "second-harmonic-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/manganite/symcrys"
Documentation = "https://manganite.github.io/symcrys/"
Issues = "https://github.com/manganite/symcrys/issues"

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/symcrys"]
# Built by `npm run bundle:python` and not committed (ignored by git), so named here explicitly.
artifacts = ["src/symcrys/_bundle.js"]

[tool.hatch.build.targets.sdist]
include = ["src/symcrys", "README.md", "LICENSE"]
artifacts = ["src/symcrys/_bundle.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/symcrys"]
