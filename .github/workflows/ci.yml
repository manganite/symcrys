name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  # The gates of CLAUDE.md, in this order. Node 22 and 24: the library targets both.
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (TypeScript 6)
        run: npm run typecheck
      - name: Type check (TypeScript 7)
        run: npm run typecheck:ts7
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dist
        run: npm run check:dist

  # The Python package (packages/python) on the TypeScript build of the same commit: bundle,
  # build sdist and wheel, install the wheel into a fresh environment, type check and test it.
  # Python 3.10 (the oldest supported, quickjs-ng wheels are abi3 from 3.10) and the newest.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.x']
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Node dependencies
        run: npm ci
      - name: Build and bundle the TypeScript package
        run: |
          npm run build
          npm run bundle:python
      - name: Build sdist and wheel
        env:
          PIP_CONSTRAINT: packages/python/requirements-ci.txt
        run: |
          python -m pip install build
          python -m build --outdir packages/python/dist packages/python
      - name: Check the wheel
        run: |
          unzip -l packages/python/dist/*.whl | grep -q 'symcrys/_bundle.js' || { echo '::error::wheel has no _bundle.js'; exit 1; }
      - name: Install the wheel and the test tools
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install packages/python/dist/*.whl pytest mypy -c packages/python/requirements-ci.txt
      - name: Type check (mypy)
        working-directory: packages/python
        run: /tmp/venv/bin/mypy
      - name: Test (pytest, against the installed wheel)
        working-directory: packages/python
        run: /tmp/venv/bin/pytest -p no:cacheprovider

  # The documentation site (docs/, #29): TypeDoc fails on an undocumented export, a broken link
  # or a referenced type that is not exported; the Python docstrings must be those written from
  # the TSDoc comments; the TypeScript examples type-check; Sphinx builds the site with every
  # example and notebook executed and every reference resolved. The external links are checked
  # apart, in linkcheck.yml, because a site elsewhere that is down must not fail a gate.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13' # the Python of docs/constraints.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Build and bundle the TypeScript package
        run: |
          npm run build
          npm run bundle:python
      - name: Install the Python package and the documentation tools
        run: python -m pip install -e packages/python -r docs/requirements.txt
        env:
          PIP_CONSTRAINT: docs/constraints.txt
      - name: TypeDoc, Python docstrings, examples
        run: npm run docs:check
      - name: Build the site
        run: npm run docs:site
      - name: Keep the site
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site
          path: build/docs/html
          if-no-files-found: error
