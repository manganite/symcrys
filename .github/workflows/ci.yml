name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  # The gates of CLAUDE.md, in this order. Node 22 and 24: the library targets both.
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (TypeScript 6)
        run: npm run typecheck
      - name: Type check (TypeScript 7)
        run: npm run typecheck:ts7
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check dist
        run: npm run check:dist
