name: Release

# Runs when a tag vX.Y.Z is pushed (by hand, after the release PR is merged; CLAUDE.md, "Releases").
on:
  push:
    tags:
      - 'v*.*.*'

# Two jobs, so that only the short npm job can obtain an OIDC token for npm: the release job runs
# the dev dependencies (install scripts, tests, lint) and never sees that token.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not of the form vX.Y.Z."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false # dev dependencies run in this job; no git token left behind
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Gates
        run: |
          npm run typecheck
          npm run typecheck:ts7
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run check:dist
      # --ignore-scripts: pack the dist/ that the gates just checked, without rebuilding it (prepack)
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent --ignore-scripts)" >> "$GITHUB_OUTPUT"
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[.*\]:/ { exit }
            capture && !started && /^$/ { next }
            capture { started = 1; print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi
          DELIM="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release with the package tarball
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: ${{ steps.pack.outputs.file }}
      - name: Keep the tarball for the npm job
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  # Submits the version to npm for approval (staged publishing). The trusted publisher on npmjs.com
  # allows only `npm stage publish`; Thomas approves the staged version with 2FA (README,
  # "Releases"). It stages the same tarball that is attached to the GitHub release. No dependency
  # cache in this job (npm trusted-publishing guidance for release builds).
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Get the tarball
        uses: actions/download-artifact@v7
        with:
          name: package
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Staging needs npm >= 11.15; Node 22 ships npm 10.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.1
      - name: Show the checksums to compare before approving
        run: |
          FILE="${{ needs.release.outputs.file }}"
          echo "${FILE} shasum: $(sha1sum "${FILE}" | cut -d' ' -f1)"
          echo "${FILE} integrity: sha512-$(openssl dgst -sha512 -binary "${FILE}" | openssl base64 -A)"
      - name: Stage on npm
        # verbose: the log shows the OIDC exchange if authentication fails (npm redacts tokens)
        run: npm stage publish "./${{ needs.release.outputs.file }}" --loglevel verbose
