name: Release

# Runs when a tag vX.Y.Z is pushed (by hand, after the release PR is merged; CLAUDE.md, "Releases").
on:
  push:
    tags:
      - 'v*.*.*'

# Three jobs, so that only the short npm and pypi jobs can obtain an OIDC token for publishing: the
# release job runs the dev dependencies (install scripts, tests, lint) and never sees such a token.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not of the form vX.Y.Z."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false # dev dependencies run in this job; no git token left behind
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tag matches both packages
        run: |
          VERSION="$(node -p "require('./packages/ts/package.json').version")"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ] || [ "${PY_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/ts/package.json (${VERSION}) and pyproject.toml (${PY_VERSION})."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci
      - name: Gates
        run: |
          npm run typecheck
          npm run typecheck:ts7
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run check:dist
      # --ignore-scripts: pack the dist/ that the gates just checked, without rebuilding it (prepack)
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent --ignore-scripts -w symcrys)" >> "$GITHUB_OUTPUT"
      # The Python package carries the dist/ just checked (bundle:python checks the versions).
      - name: Python gate and build
        env:
          PIP_CONSTRAINT: packages/python/requirements-ci.txt
        run: |
          npm run bundle:python
          python -m pip install build
          python -m build --outdir python-dist packages/python
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install python-dist/*.whl pytest mypy -c packages/python/requirements-ci.txt
          (cd packages/python && /tmp/venv/bin/mypy && /tmp/venv/bin/pytest -p no:cacheprovider)
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[.*\]:/ { exit }
            capture && !started && /^$/ { next }
            capture { started = 1; print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi
          DELIM="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release with the package tarball
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            ${{ steps.pack.outputs.file }}
            python-dist/*
      - name: Keep the tarball for the npm job
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
      - name: Keep sdist and wheel for the PyPI job
        uses: actions/upload-artifact@v6
        with:
          name: python
          path: python-dist/
          if-no-files-found: error

  # Submits the version to npm for approval (staged publishing). The trusted publisher on npmjs.com
  # allows only `npm stage publish`; Thomas approves the staged version with 2FA (README,
  # "Releases"). It stages the same tarball that is attached to the GitHub release. No dependency
  # cache in this job (npm trusted-publishing guidance for release builds).
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Get the tarball
        uses: actions/download-artifact@v7
        with:
          name: package
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Staging needs npm >= 11.15; Node 22 ships npm 10.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.1
      - name: Show the checksums to compare before approving
        run: |
          FILE="${{ needs.release.outputs.file }}"
          echo "${FILE} shasum: $(sha1sum "${FILE}" | cut -d' ' -f1)"
          echo "${FILE} integrity: sha512-$(openssl dgst -sha512 -binary "${FILE}" | openssl base64 -A)"
      - name: Stage on npm
        # verbose: the log shows the OIDC exchange if authentication fails (npm redacts tokens)
        run: npm stage publish "./${{ needs.release.outputs.file }}" --loglevel verbose

  # Publishes sdist and wheel to PyPI by trusted publishing (no token). The environment `pypi`
  # requires Thomas' approval of each run (GitHub, Settings › Environments), so nothing reaches PyPI
  # without it; the trusted publisher on pypi.org names this repository, release.yml and `pypi`.
  # Same files as attached to the GitHub release.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/symcrys/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - name: Get sdist and wheel
        uses: actions/download-artifact@v7
        with:
          name: python
          path: python-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
