name: Release

# Runs when a tag vX.Y.Z is pushed after the release PR is merged (who pushes it: CLAUDE.md, "Releases").
on:
  push:
    tags:
      - 'v*.*.*'

# Separate jobs, so that only the short npm, pypi and pages jobs can obtain an OIDC token for
# publishing: the release and site jobs run the dev dependencies (install scripts, tests, lint) and
# never see such a token.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not of the form vX.Y.Z."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # dev dependencies run in this job; no git token left behind
          fetch-depth: 0 # the history of main, for the next step
      - name: Tag is on main
        # CLAUDE.md, "Releases": the tag is set on the merge commit of the release PR, on main (#128).
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches both packages
        run: |
          VERSION="$(node -p "require('./packages/ts/package.json').version")"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ] || [ "${PY_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/ts/package.json (${VERSION}) and pyproject.toml (${PY_VERSION})."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: npm ci
      - name: Gates
        run: |
          npm run typecheck
          npm run typecheck:ts7
          npm run lint
          npm run format:check
          npm test
          npm run build
          npm run check:dist
      # --ignore-scripts: pack the dist/ that the gates just checked, without rebuilding it (prepack)
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent --ignore-scripts -w symcrys)" >> "$GITHUB_OUTPUT"
      # The Python package carries the dist/ just checked (bundle:python checks the versions).
      - name: Python gate and build
        env:
          PIP_CONSTRAINT: packages/python/requirements-ci.txt
        run: |
          npm run bundle:python
          python -m pip install build
          python -m build --outdir python-dist packages/python
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install python-dist/*.whl pytest mypy -c packages/python/requirements-ci.txt
          (cd packages/python && /tmp/venv/bin/mypy && /tmp/venv/bin/pytest -p no:cacheprovider)
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[.*\]:/ { exit }
            capture && !started && /^$/ { next }
            capture { started = 1; print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi
          DELIM="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<${DELIM}"
            echo "$NOTES"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release with the package tarball
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            ${{ steps.pack.outputs.file }}
            python-dist/*
      - name: Keep the tarball for the npm job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
      - name: Keep sdist and wheel for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: python-dist/
          if-no-files-found: error

  # Submits the version to npm for approval (staged publishing). The trusted publisher on npmjs.com
  # allows only `npm stage publish`; Thomas approves the staged version with 2FA (README,
  # "Releases"). It stages the same tarball that is attached to the GitHub release. No dependency
  # cache in this job (npm trusted-publishing guidance for release builds).
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Get the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Staging needs npm >= 11.15; Node 22 ships npm 10.
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.1
      - name: Show the checksums to compare before approving
        run: |
          FILE="${{ needs.release.outputs.file }}"
          echo "${FILE} shasum: $(sha1sum "${FILE}" | cut -d' ' -f1)"
          echo "${FILE} integrity: sha512-$(openssl dgst -sha512 -binary "${FILE}" | openssl base64 -A)"
      - name: Stage on npm
        # verbose: the log shows the OIDC exchange if authentication fails (npm redacts tokens)
        run: npm stage publish "./${{ needs.release.outputs.file }}" --loglevel verbose

  # Publishes sdist and wheel to PyPI by trusted publishing (no token). The environment `pypi`
  # requires Thomas' approval of each run (GitHub, Settings › Environments), so nothing reaches PyPI
  # without it; the trusted publisher on pypi.org names this repository, release.yml and `pypi`.
  # Same files as attached to the GitHub release.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/symcrys/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - name: Get sdist and wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python
          path: python-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-dist/

  # The documentation site, built from the tag and published on GitHub Pages (#29). Two jobs, so
  # that the one that runs the dev dependencies has no token for Pages. The environment
  # `github-pages` needs a deployment rule for tags `v*.*.*` (GitHub, Settings › Environments),
  # and Pages its source set to GitHub Actions.
  site:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13' # the Python of docs/constraints.txt
      - name: Build the site
        env:
          PIP_CONSTRAINT: docs/constraints.txt
        run: |
          npm ci
          npm run build
          npm run bundle:python
          python -m pip install -e packages/python -r docs/requirements.txt
          npm run docs:check
          npm run docs:site
      - name: Keep the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html

  # Published only after both packages were submitted (npm staged, PyPI approved), so that the site
  # does not show a version that pip cannot install.
  pages:
    needs: [site, npm, pypi]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write # OIDC token for the Pages deployment
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
